<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homemade Netflix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<!-- Header -->

<body>
  <header>
    <h1>Homemade Netflix</h1>
  </header>
    <div class="search-container">
      <input class="search-bar" type="text" id="search" placeholder="Search movies..." />
    </div>

  <main id="movie-grid">
    <div class="carousel-container">
      <div class="carousel-wrapper">
        <button id="scroll-btn-left" class="scroll-btn scroll-btn-left">&#8592;</button>
        <div id="card-container"></div>
        <button id="scroll-btn-right" class="scroll-btn scroll-btn-right">&#8594;</button>
      </div>
    </div>
  </main>
  
  <section>
    <h2>Categories</h2>
    <div class="carousel-container">
      <div class="smaller-card-container">
        <div class="smaller-card">Film</div>
        <div class="smaller-card">Série</div>
        <div class="smaller-card">Documentaire</div>
      </div>
    </div>
  </section>
  
  <footer>
    <p>Je veux rajouter tel film</p>
    <a href="whishlist.html">Clique ici</a>
  </footer>
  
  <script src="index.js"></script>
</body>

</html>
