<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homemade Netflix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Homemade Netflix</h1>
  </header>

  <div class="search-container">
    <input class="search-bar" type="text" id="search" placeholder="Search movies..." tabindex="0" />
  </div>

  <main id="movie-grid">
    <div class="carousel-container">
      <div class="carousel-wrapper">
        <button id="scroll-btn-left" class="scroll-btn scroll-btn-left">&#8592;</button>
        <div id="card-container"></div>
        <button id="scroll-btn-right" class="scroll-btn scroll-btn-right">&#8594;</button>
      </div>
    </div>
  </main>

  <div class="preview" id="preview-modal">
    <div id="preview-content">
      <button id="close-preview">✖</button>
      <img id="preview-image" src="" alt="" />
      <h3 id="preview-name"></h3>
      <p id="preview-description"></p>
      <p id="preview-duration"></p>
      <p id="preview-seasons-episodes"></p>
      <button id="play-button">Play</button>
    </div>
  </div>

  <section class="categorie">
    <h2>Categories</h2>
    <div class="carousel-container">
      <div class="smaller-card-container">
        <div class="smaller-card" tabindex="0"><a href="film.html">Film</a></div>
        <div class="smaller-card" tabindex="0"><a href="serie.html">Série</a></div>
        <div class="smaller-card" tabindex="0"><a href="documentaire.html">Documentaire</a></div>
        <div class="smaller-card" tabindex="0"><a href="whishlist.html">Whishlist</a></div>
      </div>
    </div>
  </section>

  <script type="module" src="index.js"></script>
</body>
</html>
