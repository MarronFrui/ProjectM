<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homemade Netflix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<!-- Header -->

<body>
  <header>
    <h1>Homemade Netflix</h1>
    <div class="search-container">
      <button id="search-btn"></button>
      <input class="search-bar" type="text" id="search" placeholder="Search movies..." />
    </div>
  </header>
  
  <!-- Main Movie Grid -->
  <main id="movie-grid">
    <div id="cards-container"></div>
  </main>
  
  <footer>
    <p>Je veux rajouter tel film</p>
    <a href="homemadenetflix/addprogram/">Clique ici</a>
  </footer>
  
  <script src="index.js"></script>
</body>

</html>
