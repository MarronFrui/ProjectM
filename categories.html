<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Categories - Homemade Netflix</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <h1>Categories</h1>
        </header>

        <section class="menu-container">
            <button id="back-button" tabindex="0">⬅ Back</button>
            <div class="search-container">
                <input
                    class="search-bar"
                    type="text"
                    id="search"
                    placeholder="Search movies..."
                    tabindex="0"
                />
            </div>
        </section>

        <main>
            <div class="smaller-card-container-categories" id="category-container">
            </div>
        </main>

        <script type="module" src="categories.ts"></script>
    </body>
</html>
