<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Film - Homemade Netflix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <a href="index.html" style="text-decoration: none; color: inherit;">
      <h1>Homemade Netflix</h1>
    </a>
  </header>

  <div class="search-container">
    <input class="search-bar" type="text" id="search" placeholder="Search movies..." tabindex="0" />
  </div>

  <main id="movie-grid">
    <section class="disponibility-container">
      <section class="available">
        <h2>Available</h2>
        <div class="card-container" id="available-cards"></div>
      </section>
      <section class="unavailable">
        <h2>Unavailable</h2>
        <div class="card-container" id="unavailable-cards"></div>
      </section>
    </section>
  </main>

    <section class="categorie">
    <h2>Categories</h2>
    <div class="carousel-container">
      <div class="smaller-card-container">
        <div class="smaller-card" tabindex="0"><a href="index.html">Home</a></div>
        <div class="smaller-card" tabindex="0"><a href="categories.html">Categories</a></div>

      </div>
    </div>
  </section>



  <script type="module" src="index.js"></script>
  <script>
    renderPage("null");
  </script>
</body>
</html>
